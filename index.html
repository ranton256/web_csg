<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Web CSG</title>
    <!-- Empty icon: stops the browser requesting /favicon.ico (a 404 is a console error). -->
    <link rel="icon" href="data:,">
    <style>
      body { margin: 16px; font-family: system-ui, sans-serif; }
      main { display: flex; gap: 16px; align-items: flex-start; }
      #source { width: 420px; height: 480px; box-sizing: border-box; font: 13px/1.4 ui-monospace, monospace; }
      /* CSS size equals pixel size: one ray per CSS pixel (DESIGN §5). */
      #preview { width: 640px; height: 480px; background: #1f1f24; }
      #diagnostics { margin: 8px 0 0; padding-left: 20px; color: #b00020; font: 13px/1.4 ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <h1>Web CSG</h1>
    <main>
      <section>
        <textarea id="source" spellcheck="false" aria-label="Model source"></textarea>
        <ul id="diagnostics" aria-label="Diagnostics"></ul>
      </section>
      <canvas id="preview" width="640" height="480" aria-label="Rendered preview"></canvas>
    </main>
    <script type="module" src="src/ui/main.js"></script>
  </body>
</html>
